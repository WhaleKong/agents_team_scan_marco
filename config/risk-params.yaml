# Risk Management Parameters
# Based on Druckenmiller's framework

position_sizing:
  # Maximum allocation to a single position
  max_single_position_pct: 30
  # Normal position size range
  normal_position_min_pct: 5
  normal_position_max_pct: 10
  # Low conviction size
  low_conviction_max_pct: 3
  # Stop loss: max risk per trade
  max_risk_per_trade_pct: 2

portfolio_limits:
  # Gross exposure = sum of abs(all positions)
  max_gross_exposure_pct: 150
  # Net exposure = longs - shorts
  max_net_long_pct: 100
  max_net_short_pct: -100
  # Sector/theme concentration
  max_sector_concentration_pct: 40
  # Correlated positions cluster
  max_correlated_cluster_pct: 50
  # Total portfolio heat (sum of all position risks to stop)
  max_portfolio_heat_pct: 6

circuit_breakers:
  # Month-to-date drawdown triggers
  reduce_trigger_mtd_pct: -5
  reduce_action: "Cut all positions by 50%"
  halt_trigger_mtd_pct: -10
  halt_action: "Go to 100% cash, reassess everything"
  # Single position drawdown
  single_position_review_pct: -3
  single_position_review_action: "Review thesis, tighten stop"
  # Volatility spike
  vix_reduce_trigger: 35
  vix_reduce_action: "Reduce gross exposure to 80%"

conviction_sizing:
  high:
    description: "Regime CLEAR + Quant signals 3+ aligned + Strong catalyst"
    size_range: "20-30% NAV"
    kelly_fraction: 1.0  # Full Kelly
    min_rr_ratio: 3.0
  medium:
    description: "Regime CLEAR + Some signal confirmation"
    size_range: "5-10% NAV"
    kelly_fraction: 0.5  # Half Kelly
    min_rr_ratio: 3.0
  low:
    description: "Mixed signals or TRANSITION regime"
    size_range: "1-3% NAV"
    kelly_fraction: 0.25  # Quarter Kelly
    min_rr_ratio: 5.0
  none:
    description: "No clear setup"
    size_range: "0% (cash)"
    kelly_fraction: 0
    min_rr_ratio: null

kelly_criterion:
  # f* = (bp - q) / b
  # b = reward/risk ratio, p = win probability, q = 1-p
  # Always use fractional Kelly in practice
  default_fraction: 0.5  # Half-Kelly for safety
  max_kelly_output_pct: 30  # Cap even if Kelly suggests more

correlation_thresholds:
  # Consider positions correlated above this level
  high_correlation: 0.7
  # Must reduce combined size above this
  reduce_if_correlated: true
  # Combined correlated position limit
  max_combined_correlated_pct: 50
